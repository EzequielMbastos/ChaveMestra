# ============================================
# EXEMPLO DE CONFIGURAÇÃO - COPIAR E PREENCHER
# ============================================

# Configuração do Banco de Dados
spring.datasource.url=jdbc:postgresql://db.SEU_PROJETO.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rate limit do chat de IA
ia.rate-limit.requests-per-hour=${IA_RATE_LIMIT_PER_HOUR:20}
ia.rate-limit.requests-per-day=${IA_RATE_LIMIT_PER_DAY:100}