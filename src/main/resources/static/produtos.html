<!-- ===========================================================
     MODAL PRODUTO
     =========================================================== -->

<div
        class="modal fade"
        id="modalProduto"
        tabindex="-1"
        aria-hidden="true">

  ```
  <div class="modal-dialog">

    <div class="modal-content">


      <form id="formProduto">


        <!-- =================================================
             CABEÇALHO DO MODAL
             ================================================= -->

        <div class="modal-header">

          <h5 class="modal-title">
            Produto
          </h5>


          <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Fechar">
          </button>

        </div>


        <!-- =================================================
             CORPO DO MODAL
             ================================================= -->

        <div class="modal-body">


          <!-- ID -->

          <input
                  type="hidden"
                  id="produto-id">


          <!-- CÓDIGO -->

          <div class="mb-3">

            <label
                    for="produto-codigo"
                    class="form-label">

              Código de catálogo

            </label>


            <input
                    type="text"
                    id="produto-codigo"
                    class="form-control"
                    maxlength="50"
                    required>

          </div>


          <!-- NOME -->

          <div class="mb-3">

            <label
                    for="produto-nome"
                    class="form-label">

              Nome

            </label>


            <input
                    type="text"
                    id="produto-nome"
                    class="form-control"
                    maxlength="100"
                    required>

          </div>


          <!-- PREÇO -->

          <div class="mb-3">

            <label
                    for="produto-preco"
                    class="form-label">

              Preço de venda

            </label>


            <input
                    type="number"
                    id="produto-preco"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required>

          </div>


          <!-- =================================================
               CATEGORIA
               ================================================= -->

          <div class="mb-3">

            <label
                    for="produto-categoria"
                    class="form-label">

              Categoria

            </label>


            <div class="input-group">


              <select
                      id="produto-categoria"
                      class="form-select"
                      required>

                <option value="">
                  Selecione uma categoria
                </option>

              </select>


              <button
                      type="button"
                      class="btn btn-outline-primary"
                      id="btnNovaCategoria">

                <i class="bi bi-plus"></i>

                Nova categoria

              </button>


            </div>

          </div>

        </div>


        <!-- =================================================
             RODAPÉ
             ================================================= -->

        <div class="modal-footer">

          <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">

            Cancelar

          </button>


          <button
                  type="submit"
                  class="btn btn-primary">

            Salvar

          </button>

        </div>


      </form>

    </div>

  </div>
  ```

</div>

<!-- ===========================================================
     MODAL NOVA CATEGORIA

<div
        class="modal fade"
        id="modalCategoria"
        tabindex="-1"
        aria-hidden="true">

  ```
  <div class="modal-dialog">

    <div class="modal-content">


      <form id="formCategoria">


        <!-- =================================================
             CABEÇALHO
             ================================================= -->

        <div class="modal-header">

          <h5 class="modal-title">

            Nova categoria

          </h5>


          <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Fechar">
          </button>

        </div>


        <!-- =================================================
             CORPO
             ================================================= -->

        <div class="modal-body">


          <!-- NOME -->

          <div class="mb-3">

            <label
                    for="categoria-nome"
                    class="form-label">

              Nome

            </label>


            <input
                    type="text"
                    id="categoria-nome"
                    class="form-control"
                    maxlength="50"
                    required>

          </div>


          <!-- DESCRIÇÃO -->

          <div class="mb-3">

            <label
                    for="categoria-descricao"
                    class="form-label">

              Descrição

            </label>


            <textarea
                    id="categoria-descricao"
                    class="form-control"
                    maxlength="100"
                    rows="3">
          </textarea>

          </div>

        </div>


        <!-- =================================================
             RODAPÉ
             ================================================= -->

        <div class="modal-footer">

          <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">

            Cancelar

          </button>


          <button
                  type="submit"
                  class="btn btn-primary">

            Salvar categoria

          </button>

        </div>


      </form>

    </div>

  </div>
