spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.msgwqxmwwlceebndvqfm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true

spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

# Flyway (migrações versionadas de banco)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# OpenRouter (IA)
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.model=${OPENROUTER_MODEL:deepseek/deepseek-chat}
openrouter.api.model.fallback=${OPENROUTER_MODEL_FALLBACK:deepseek/deepseek-v3.1}
openrouter.api.provider-order=${OPENROUTER_PROVIDER_ORDER:DeepInfra,Together,Fireworks}
openrouter.api.timeout-seconds=60

# Basic Auth para chamadas internas das tools
app.security.basic.user=${APP_SECURITY_BASIC_USER:admin}
app.security.basic.password=${APP_SECURITY_BASIC_PASSWORD:admin123}
